<!DOCTYPE html>
<html>
<head>

  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="uPlot/dist/uPlot.min.css">
  <script src="uPlot/dist/uPlot.iife.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
  crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
  crossorigin=""></script>

  <link rel="stylesheet" type="text/css" href="vdla.css">

</head>

<body>
<title>VDLA</title></head>
  <div id="full">

    <section id="upload_sec" class="centered" style="visibility : hidden;">
      <h1 id="app_title">Vesc Data Log Analyzer</h1><br>
      <label for="board_mode">Board profile</label>
      <select id="board_mode">
        <option value="eskate">E-skateboard</option>
        <option value="efoil">Efoil</option>
      </select><br><br>
      <input type="file" id="files" name="files[]" multiple />
    </section>

    <section id="loader_sec" class="centered" style="visibility : visible;">
       <div class="loader"></div>
    </section>

    <section id="content_sec" style="visibility: hidden;">
      <div class="menu_container">
        <div class="menu_icon_container" onclick="menu_click(this)">
         <div class="bar1"></div>
         <div class="bar2"></div>
         <div class="bar3"></div>
        </div>
        <div id="menu_list_container">
          <ul id="menu_list"></ul>
        </div>
      </div>
      <div id="tab_bar">
        <button id="tab_overview" class="tab_button" onclick="show_tab('overview')">Overview</button>
        <button id="tab_log" class="tab_button active" onclick="show_tab('log')">Log</button>
        <button id="tab_performance" class="tab_button" onclick="show_tab('performance')">Performance</button>
      </div>
      <div id="overview_view">
        <div id="overview_content"></div>
        <div id="overview_chart"></div>
      </div>
      <div id="log_view">
        <div id="mapid"></div>
        <div id="split_handle" role="separator" aria-label="Resize map and chart" aria-orientation="horizontal" tabindex="0"></div>
        <div id="chart_container">
          <div id="playback_controls" aria-label="Log playback controls">
            <button id="playback_toggle" type="button" aria-label="Play log">Play</button>
            <button id="playback_restart" type="button">Restart</button>
            <label for="playback_speed">Speed</label>
            <select id="playback_speed">
              <option value="0.25">Slowmo 0.25x</option>
              <option value="1" selected>Realtime 1x</option>
              <option value="2">Fast 2x</option>
              <option value="4">High speed 4x</option>
              <option value="10">High speed 10x</option>
            </select>
            <output id="playback_status" aria-live="polite">Ready</output>
          </div>
          <div id="chart" class="chartclass"></div>
          <span id="uplot_creds"><a href="https://github.com/leeoniya/uPlot" title="A small fast chart for time series, lines, areas, ohlc & bars">uPlot</a> 1.6.32</span>
        </div>
      </div>
      <div id="performance_view">
        <div id="performance_content"></div>
      </div>
      <output id="file_list"></output>
      <output id="settings_list"></output>
      <output id="file_content"></output>
    </section>
  </div>
</body>

<script type="text/javascript" src="vdla.js"></script>

</html>
